<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat — Eliget</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">
  <style>
    :root { --bg: #F3F4F6; --surface: #FFFFFF; --text: #111827; --text-muted: #6B7280; --line: #E5E7EB; --green: #10B981; --blue: #3B82F6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; }

    .top-nav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; padding: 5px; border-radius: 50%; }
    .back-btn svg { width: 24px; height: 24px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    .header-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .header-avatar { width: 36px; height: 36px; border-radius: 50%; background: #E5E7EB; background-size: cover; background-position: center; }
    .header-name { font-family: 'Archivo', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text); }

    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    
    .message { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; position: relative; }
    .message.received { background: var(--surface); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--line); }
    .message.sent { background: var(--green); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message-time { font-size: 0.65rem; margin-top: 4px; text-align: right; opacity: 0.7; }

    .input-area { padding: 15px 20px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 10px; padding-bottom: env(safe-area-inset-bottom, 15px); }
    .input-area input { flex: 1; padding: 12px 15px; border: 1px solid var(--line); border-radius: 999px; font-family: inherit; font-size: 0.95rem; outline: none; background: var(--bg); }
    .input-area input:focus { border-color: var(--green); background: var(--surface); }
    .btn-send { background: var(--green); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
    .btn-send svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-left: -2px; margin-top: 2px; }
  
    /* Chat Badge */
    .chat-badge { position: absolute; top: -2px; right: 15px; background: #EF4444; color: white; font-size: 0.6rem; font-weight: 700; padding: 2px 5px; border-radius: 999px; min-width: 16px; text-align: center; border: 2px solid var(--surface); }
  
    /* Dark Theme Styles */
    [data-theme="dark"] {
      --bg: #111827;
      --surface: #1F2937;
      --text: #F9FAFB;
      --text-muted: #9CA3AF;
      --line: #374151;
    }
    [data-theme="dark"] body { background-color: var(--bg); color: var(--text); }
    [data-theme="dark"] .top-nav, [data-theme="dark"] .bottom-nav, [data-theme="dark"] .search-container, [data-theme="dark"] .post-card, [data-theme="dark"] .settings-card, [data-theme="dark"] .job-card, [data-theme="dark"] .comment-body, [data-theme="dark"] .modal-box, [data-theme="dark"] .chat-item, [data-theme="dark"] .notification-item, [data-theme="dark"] .comments-box, [data-theme="dark"] .login-box { background-color: var(--surface); border-color: var(--line); }
    [data-theme="dark"] input, [data-theme="dark"] textarea { background-color: var(--bg); color: var(--text); border-color: var(--line); }
    [data-theme="dark"] input:focus, [data-theme="dark"] textarea:focus { background-color: var(--surface); }
    [data-theme="dark"] .dropdown-menu { background-color: var(--surface); border-color: var(--line); }
    [data-theme="dark"] .dropdown-item:hover { background-color: var(--bg); }
    [data-theme="dark"] .icon-btn-wrapper { background-color: var(--bg); border-color: var(--line); }
    [data-theme="dark"] .icon-btn-wrapper:hover { background-color: var(--line); }
    [data-theme="dark"] .logo { color: var(--text); }
    [data-theme="dark"] .search-wrapper input { background-color: var(--bg); }
    [data-theme="dark"] .search-wrapper input:focus { background-color: var(--surface); }
    [data-theme="dark"] .settings-btn:hover, [data-theme="dark"] .menu-btn:hover { background-color: var(--bg); }
    [data-theme="dark"] .settings-btn svg, [data-theme="dark"] .menu-btn svg { stroke: var(--text-muted); }
    [data-theme="dark"] .avatar-text, [data-theme="dark"] .search-user-avatar { background-color: var(--green); }
    [data-theme="dark"] .user-list-item:hover { background-color: var(--bg); }
    [data-theme="dark"] .post-content a { color: var(--green); }
    [data-theme="dark"] ::-webkit-scrollbar { width: 8px; }
    [data-theme="dark"] ::-webkit-scrollbar-track { background: var(--bg); }
    [data-theme="dark"] ::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }

  </style>
</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.location.href='/chat.html'">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="header-user" id="headerUser" onclick="window.location.href='/profile.html?id=' + targetUserId">
      <div class="header-avatar" id="headerAvatar">
    <button class="icon-btn-wrapper theme-toggle" style="margin-left: 5px; border: none; background: transparent;" title="Toggle Theme">
      <svg class="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
</div>
      <div class="header-name" id="headerName">Loading...</div>
    </div>
  </div>

  <div class="chat-container" id="chatContainer"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
    <button class="btn-send" id="sendBtn">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let user = null;
    let targetUserId = null;
    let socket = null;

    const urlParams = new URLSearchParams(window.location.search);
    targetUserId = urlParams.get('id');
    if (!targetUserId) window.location.href = '/chat.html';

    async function initAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error();
        const data = await res.json();
        user = data.user;
        localStorage.setItem('eliget_user', JSON.stringify(user));
        
        if (user.id === targetUserId) window.location.href = '/dashboard.html';

        loadTargetUserInfo();
        loadMessages();
        setupSocket();
      } catch (err) {
        localStorage.removeItem('eliget_user');
        window.location.href = '/login.html';
      }
    }

    async function loadTargetUserInfo() {
      try {
        const res = await fetch(`/api/user/profile/${targetUserId}`);
        const data = await res.json();
        if (res.ok) {
          document.getElementById('headerName').innerText = data.user.fullName;
          if (data.user.profilePic) document.getElementById('headerAvatar').style.backgroundImage = `url(${data.user.profilePic})`;
        }
      } catch (err) {}
    }

    async function loadMessages() {
      const container = document.getElementById('chatContainer');
      try {
        const res = await fetch(`/api/chats/${targetUserId}`);
        const messages = await res.json();
        
        container.innerHTML = messages.map(msg => {
          const isSent = msg.sender === user.id;
          const time = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          return `
            <div class="message ${isSent ? 'sent' : 'received'}">
              ${msg.text}
              <div class="message-time">${time}</div>
            </div>
          `;
        }).join('');
        
        scrollToBottom();
      } catch (err) { console.error(err); }
    }

    function setupSocket() {
      socket = io();
      socket.on('newChatMessage', () => {
        if (typeof fetchChatBadge === 'function') fetchChatBadge();
        else if (typeof fetchBadges === 'function') fetchBadges();
        else {
            // Fallback fetch directly
            fetch('/api/chat/unread').then(r=>r.json()).then(d=>{
                const b = document.getElementById('navChatBadge');
                if(b && d.unreadCount > 0) { b.style.display='block'; b.innerText = d.unreadCount > 99 ? '99+' : d.unreadCount; }
            }).catch(()=>{});
        }
      }); 
      socket.on('receiveMessage', (msg) => {
        if ((msg.sender === user.id && msg.receiver === targetUserId) || (msg.sender === targetUserId && msg.receiver === user.id)) {
          const container = document.getElementById('chatContainer');
          const isSent = msg.sender === user.id;
          const time = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const msgHTML = `
            <div class="message ${isSent ? 'sent' : 'received'}">
              ${msg.text}
              <div class="message-time">${time}</div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', msgHTML);
          scrollToBottom();
        }
      });
    }

    function scrollToBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !socket) return;
      socket.emit('sendMessage', { receiverId: targetUserId, text });
      input.value = '';
    }

    initAuth();
  
    // Fetch Chat Badge
    async function fetchChatBadge() {
      try {
        const res = await fetch('/api/chat/unread');
        const data = await res.json();
        const badge = document.getElementById('navChatBadge');
        if (badge && data.unreadCount > 0) {
          badge.style.display = 'block';
          badge.innerText = data.unreadCount > 99 ? '99+' : data.unreadCount;
        }
      } catch (err) { console.error(err); }
    }
    fetchChatBadge();
  
  </script>
<script src="/anti-addiction.js"></script>
<script src="/theme.js"></script>
</body>
</html>
