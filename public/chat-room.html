<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat — Eliget</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg: #F3F4F6; --surface: #FFFFFF; --text: #111827; --text-muted: #6B7280; --line: #E5E7EB; --green: #10B981; --blue: #3B82F6; }
    [data-theme="dark"] { --bg: #111827; --surface: #1F2937; --text: #F9FAFB; --text-muted: #9CA3AF; --line: #374151; }
    [data-theme="dark"] body { background-color: var(--bg); color: var(--text); }
    [data-theme="dark"] .top-nav, [data-theme="dark"] .input-area { background-color: var(--surface); border-color: var(--line); }
    [data-theme="dark"] .message.received { background-color: var(--surface); color: var(--text); border-color: var(--line); }
    [data-theme="dark"] .input-area input { background-color: var(--bg); color: var(--text); }
    [data-theme="dark"] .btn-icon { background: var(--bg); border-color: var(--line); color: var(--text); }
    [data-theme="dark"] .voice-message { background: var(--bg); }
    [data-theme="dark"] .message.sent .voice-message { background: rgba(255,255,255,0.15); }
    [data-theme="dark"] .action-sheet { background: var(--surface); }
    [data-theme="dark"] .action-item { border-color: var(--line); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; }

    .top-nav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; padding: 5px; border-radius: 50%; }
    .back-btn svg { width: 24px; height: 24px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .header-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .header-avatar { width: 36px; height: 36px; border-radius: 50%; background: #E5E7EB; background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; color: white; font-weight: 700; background-color: var(--green); }
    .header-name { font-family: 'Archivo', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 4px; }

    .badge-icon { width: 16px; height: 16px; fill: #3B82F6; vertical-align: text-bottom; }

    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; position: relative; }

    .message { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; position: relative; transition: background 0.2s; }
    .message.received { background: var(--surface); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--line); }
    .message.sent { background: var(--green); color: white; align-self: flex-end; border-bottom-right-radius: 4px; cursor: pointer; }
    
    .message-time { font-size: 0.65rem; margin-top: 4px; text-align: right; opacity: 0.8; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
    .message.sent .message-time { color: rgba(255,255,255,0.9); }
    .message.received .message-time { color: var(--text-muted); }

    .edited-text { font-size: 0.65rem; opacity: 0.8; margin-right: 4px; }
    
    .ticks { display: flex; align-items: center; margin-left: 4px; }
    .ticks svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }
    .ticks.read svg { stroke: #60A5FA; }

    .chat-image-container { margin-bottom: 5px; }
    .chat-image { width: 100%; max-width: 250px; border-radius: 12px; display: block; cursor: pointer; object-fit: cover; }

    .voice-message { display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 8px 12px; border-radius: 12px; margin-bottom: 4px; min-width: 200px; }
    .message.sent .voice-message { background: rgba(255,255,255,0.2); }
    
    .play-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; color: var(--green); }
    .message.sent .play-btn { background: white; }
    .play-btn svg { width: 16px; height: 16px; fill: currentColor; stroke: none; margin-left: 2px; }
    .play-btn.paused svg { margin-left: 0; }

    .audio-wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 20px; }
    .wave-bar { width: 3px; background: var(--text-muted); border-radius: 2px; opacity: 0.5; }
    .message.sent .wave-bar { background: rgba(255,255,255,0.7); opacity: 1; }
    .wave-bar:nth-child(1) { height: 40%; }
    .wave-bar:nth-child(2) { height: 70%; }
    .wave-bar:nth-child(3) { height: 100%; }
    .wave-bar:nth-child(4) { height: 60%; }
    .wave-bar:nth-child(5) { height: 80%; }
    .wave-bar:nth-child(6) { height: 50%; }
    .wave-bar:nth-child(7) { height: 90%; }
    .wave-bar:nth-child(8) { height: 30%; }

    .audio-duration { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); flex-shrink: 0; }
    .message.sent .audio-duration { color: white; }
    .voice-message audio { display: none; }

    .typing-indicator { display: none; align-self: flex-start; background: var(--surface); padding: 10px 15px; border-radius: 18px; border-bottom-left-radius: 4px; border: 1px solid var(--line); margin-top: 5px; }
    .typing-indicator.show { display: flex; gap: 4px; align-items: center; }
    .typing-dot { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .input-area { padding: 15px 20px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; padding-bottom: env(safe-area-inset-bottom, 15px); }
    .input-area input { flex: 1; padding: 12px 15px; border: 1px solid var(--line); border-radius: 999px; font-family: inherit; font-size: 0.95rem; outline: none; background: var(--bg); color: var(--text); }
    .input-area input:focus { border-color: var(--green); background: var(--surface); }
    
    .btn-icon { background: var(--bg); color: var(--text-muted); border: 1px solid var(--line); width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; transition: all 0.2s; }
    .btn-icon:hover { background: #E5E7EB; color: var(--text); }
    .btn-icon.recording { background: #EF4444; color: white; border-color: #EF4444; animation: pulse 1s infinite; }
    .btn-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    .btn-send { background: var(--green); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; transition: transform 0.2s; }
    .btn-send:active { transform: scale(0.95); }
    .btn-send svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-left: -2px; margin-top: 2px; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
    .image-modal.show { display: flex; opacity: 1; }
    .image-modal img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; }
    .close-modal { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .close-modal svg { width: 24px; height: 24px; stroke: white; stroke-width: 2; }

    .action-sheet-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: flex-end; }
    .action-sheet-overlay.show { display: flex; }
    .action-sheet { background: var(--surface); width: 100%; max-width: 600px; margin: 0 auto; border-radius: 24px 24px 0 0; padding: 20px; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .action-item { display: flex; align-items: center; gap: 12px; padding: 15px; border-bottom: 1px solid var(--line); cursor: pointer; font-weight: 600; color: var(--text); }
    .action-item:last-child { border-bottom: none; }
    .action-item.danger { color: #EF4444; }
    .action-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
  </style>
</head>
<body>

  <div id="splashScreen" style="position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.3s ease;">
    <div style="font-family: 'Archivo', sans-serif; font-size: 2.5rem; font-weight: 900; color: var(--text); margin-bottom: 15px;">Eli<span style="color: var(--green);">get</span></div>
    <div style="font-family: 'Inter', sans-serif; font-size: 1rem; color: var(--text-muted); font-weight: 500; margin-bottom: 20px;" id="splashText">Loading Chatroom...</div>
    <div style="width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
  </div>

  <div class="top-nav">
    <button class="back-btn" onclick="window.location.href='/chat.html'">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="header-user" id="headerUser" onclick="window.location.href='/profile.html?id=' + targetUserId">
      <div class="header-avatar" id="headerAvatar"></div>
      <div class="header-name" id="headerName">Loading...</div>
    </div>
  </div>

  <div class="chat-container" id="chatContainer"></div>
  <div class="typing-indicator" id="typingIndicator">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  </div>

  <div class="input-area">
    <input type="file" id="chatImageInput" accept="image/*" style="display: none;">
    <button class="btn-icon" id="imageBtn" title="Send Photo">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
    </button>

    <button class="btn-icon" id="recordBtn" title="Record Voice Note">
      <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
    </button>

    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
    
    <button class="btn-send" id="sendBtn">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>

  <div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <button class="close-modal" onclick="closeImageModal()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <img id="fullscreenImage" src="" alt="Enlarged Image" onclick="event.stopPropagation()">
  </div>

  <div class="action-sheet-overlay" id="actionSheetOverlay" onclick="closeActionSheet()">
    <div class="action-sheet" onclick="event.stopPropagation()">
      <div class="action-item" id="editMsgBtn" onclick="editMessage()">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        Edit Message
      </div>
      <div class="action-item danger" onclick="deleteMessageFromSheet()">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Delete Message
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let user = null;
    let targetUserId = null;
    let socket = null;
    let targetUserData = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    
    let selectedMsgId = null;
    let selectedMsgText = "";
    let selectedMsgIsMedia = false;

    const urlParams = new URLSearchParams(window.location.search);
    targetUserId = urlParams.get('id');
    
    if (!targetUserId || targetUserId === 'undefined' || targetUserId === 'null') {
      window.location.href = '/chat.html';
      throw new Error("No target user ID provided");
    }

    function getBadgeSVG(author) {
      if (author && author.badge && author.followers && author.followers.length >= 100) {
        return `<svg class="badge-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;
      }
      return '';
    }

    async function initAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error();
        const data = await res.json();
        user = data.user;
        localStorage.setItem('eliget_user', JSON.stringify(user));

        if (user.id === targetUserId) {
          window.location.href = '/dashboard.html';
          return;
        }

        await loadTargetUserInfo();
        await loadMessages();
        setupSocket();

        const splash = document.getElementById('splashScreen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 300);
        document.body.style.opacity = '1';
        
      } catch (err) {
        localStorage.removeItem('eliget_user');
        window.location.href = '/login.html';
      }
    }

    async function loadTargetUserInfo() {
      try {
        const res = await fetch(`/api/user/profile/${targetUserId}`);
        const data = await res.json();
        if (res.ok) {
          targetUserData = data.user;
          document.getElementById('headerName').innerHTML = `${data.user.fullName} ${getBadgeSVG(data.user)}`;
          document.getElementById('splashText').innerText = `Loading ${data.user.fullName}'s Chatroom...`;
          const avatarDiv = document.getElementById('headerAvatar');
          if (data.user.profilePic) avatarDiv.style.backgroundImage = `url(${data.user.profilePic})`;
          else { avatarDiv.innerText = data.user.fullName.charAt(0).toUpperCase(); }
        }
      } catch (err) {}
    }

    function getTicksHTML(isRead) {
      return `<div class="ticks ${isRead ? 'read' : ''}">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
          <polyline points="20 6 9 17 4 12" style="transform: translateX(-6px);"></polyline>
        </svg>
      </div>`;
    }

    function getAudioHTML(url) {
      return `
        <div class="voice-message">
          <button class="play-btn paused" onclick="toggleAudio(this)">
            <svg class="icon-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>
          <div class="audio-wave">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div>
          </div>
          <span class="audio-duration">0:00</span>
          <audio src="${url}" preload="metadata" onloadedmetadata="setAudioDuration(this)" onended="audioEnded(this)"></audio>
        </div>
      `;
    }

    function getImageHTML(msgId) {
      return `
        <div class="chat-image-container">
          <img src="/api/chat/image/${msgId}" class="chat-image" onclick="event.stopPropagation(); openImageModal(this.src)">
        </div>
      `;
    }

    async function loadMessages() {
      const container = document.getElementById('chatContainer');
      try {
        const res = await fetch(`/api/chats/${targetUserId}`);
        const messages = await res.json();

        container.innerHTML = messages.map(msg => {
          const isSent = msg.sender === user.id;
          const time = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          let content = msg.text;
          if (msg.audioUrl) content = getAudioHTML(msg.audioUrl);
          else if (msg.imageUrl) content = getImageHTML(msg._id);
          
          let editedText = msg.isEdited ? `<span class="edited-text">(edited)</span>` : '';
          
          let clickAction = isSent ? `onclick="openActionSheet('${msg._id}', '${(msg.text || '').replace(/'/g, "\\'")}', ${!!msg.audioUrl || !!msg.imageUrl})"` : '';

          return `
            <div class="message ${isSent ? 'sent' : 'received'}" id="msg-${msg._id}" ${clickAction}>
              ${content}
              <div class="message-time">
                ${editedText} ${time}
                ${isSent ? getTicksHTML(msg.isRead) : ''}
              </div>
            </div>
          `;
        }).join('');

        scrollToBottom();
        
        // THIS IS THE FIX FOR SEEN STATUS
        if (socket) socket.emit('markRead', { senderId: targetUserId });

      } catch (err) { console.error(err); }
    }

    function setupSocket() {
      socket = io();
      
      socket.on('receiveMessage', (msg) => {
        if ((msg.sender === user.id && msg.receiver === targetUserId) || (msg.sender === targetUserId && msg.receiver === user.id)) {
          const container = document.getElementById('chatContainer');
          const isSent = msg.sender === user.id;
          const time = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          let content = msg.text;
          if (msg.audioUrl) content = getAudioHTML(msg.audioUrl);
          else if (msg.imageUrl) content = getImageHTML(msg._id);

          document.getElementById('typingIndicator').classList.remove('show');
          
          let clickAction = isSent ? `onclick="openActionSheet('${msg._id}', '${(msg.text || '').replace(/'/g, "\\'")}', ${!!msg.audioUrl || !!msg.imageUrl})"` : '';

          const msgHTML = `
            <div class="message ${isSent ? 'sent' : 'received'}" id="msg-${msg._id}" ${clickAction}>
              ${content}
              <div class="message-time">
                ${time}
                ${isSent ? getTicksHTML(msg.isRead) : ''}
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', msgHTML);
          scrollToBottom();

          // If I received a message while looking at the screen, mark it as read immediately
          if (!isSent) socket.emit('markRead', { senderId: targetUserId });
        }
      });

      socket.on('messagesRead', (data) => {
        if (data.receiverId === targetUserId) {
          const ticks = document.querySelectorAll('.message.sent .ticks');
          ticks.forEach(tick => {
            tick.classList.add('read');
          });
        }
      });

      socket.on('userTyping', (data) => {
        if (data.senderId === targetUserId) {
          document.getElementById('typingIndicator').classList.add('show');
          scrollToBottom();
        }
      });

      socket.on('messageDeleted', (data) => {
        const msgElement = document.getElementById(`msg-${data.messageId}`);
        if (msgElement) msgElement.remove();
      });
    }

    function scrollToBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    function openActionSheet(msgId, text, isMedia) {
      selectedMsgId = msgId;
      selectedMsgText = text;
      selectedMsgIsMedia = isMedia;

      const editBtn = document.getElementById('editMsgBtn');
      if (isMedia) {
        editBtn.style.display = 'none'; 
      } else {
        editBtn.style.display = 'flex';
      }

      document.getElementById('actionSheetOverlay').classList.add('show');
    }

    function closeActionSheet() {
      document.getElementById('actionSheetOverlay').classList.remove('show');
    }

    function editMessage() {
      closeActionSheet();
      const newText = prompt("Edit your message:", selectedMsgText);
      if (newText !== null && newText.trim() !== "" && newText !== selectedMsgText) {
        fetch(`/api/messages/${selectedMsgId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: newText.trim() })
        });
      }
    }

    function deleteMessageFromSheet() {
      closeActionSheet();
      if (!confirm('Delete this message?')) return;
      fetch(`/api/messages/${selectedMsgId}`, { method: 'DELETE' });
    }

    const imageBtn = document.getElementById('imageBtn');
    const chatImageInput = document.getElementById('chatImageInput');

    imageBtn.addEventListener('click', () => chatImageInput.click());

    chatImageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const originalSvg = imageBtn.innerHTML;
      imageBtn.innerHTML = `<div style="width:16px; height:16px; border:2px solid var(--text-muted); border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite;"></div>`;

      const formData = new FormData();
      formData.append('image', file);

      try {
        const res = await fetch('/api/upload-chat-image', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
          socket.emit('sendMessage', { receiverId: targetUserId, imageUrl: data.imageUrl });
        } else {
          alert('Failed to upload image.');
        }
      } catch (err) {
        console.error(err);
        alert('Error uploading image.');
      } finally {
        imageBtn.innerHTML = originalSvg;
        chatImageInput.value = ''; 
      }
    });

    function openImageModal(src) {
      const modal = document.getElementById('imageModal');
      document.getElementById('fullscreenImage').src = src;
      modal.classList.add('show');
    }

    function closeImageModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.remove('show');
      document.getElementById('fullscreenImage').src = '';
    }

    function setAudioDuration(audioEl) {
      const duration = audioEl.duration;
      if (!isNaN(duration)) {
        const mins = Math.floor(duration / 60);
        const secs = Math.floor(duration % 60);
        audioEl.parentElement.querySelector('.audio-duration').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
      }
    }

    function toggleAudio(btn) {
      const audio = btn.parentElement.querySelector('audio');
      const playIcon = btn.querySelector('.icon-play');
      const pauseIcon = btn.querySelector('.icon-pause');

      if (audio.paused) {
        document.querySelectorAll('audio').forEach(a => {
          if (a !== audio) {
            a.pause();
            const otherBtn = a.parentElement.querySelector('.play-btn');
            otherBtn.classList.add('paused');
            otherBtn.querySelector('.icon-play').style.display = 'block';
            otherBtn.querySelector('.icon-pause').style.display = 'none';
          }
        });

        audio.play();
        btn.classList.remove('paused');
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        audio.pause();
        btn.classList.add('paused');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    function audioEnded(audioEl) {
      const btn = audioEl.parentElement.querySelector('.play-btn');
      btn.classList.add('paused');
      btn.querySelector('.icon-play').style.display = 'block';
      btn.querySelector('.icon-pause').style.display = 'none';
    }

    const messageInput = document.getElementById('messageInput');
    messageInput.addEventListener('input', () => {
      if (!socket) return;
      socket.emit('typing', { receiverId: targetUserId });
    });

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !socket) return;
      socket.emit('sendMessage', { receiverId: targetUserId, text });
      messageInput.value = '';
    }

    const recordBtn = document.getElementById('recordBtn');
    
    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = event => {
            audioChunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const formData = new FormData();
            formData.append('audio', audioBlob, 'voice.webm');

            recordBtn.classList.remove('recording');
            recordBtn.innerHTML = `<div style="width:16px; height:16px; border:2px solid var(--text-muted); border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite;"></div>`;

            try {
              const res = await fetch('/api/upload-audio', { method: 'POST', body: formData });
              const data = await res.json();
              if (res.ok) {
                socket.emit('sendMessage', { receiverId: targetUserId, audioUrl: data.audioUrl });
              } else {
                alert('Failed to upload voice note');
              }
            } catch (err) {
              console.error(err);
              alert('Error uploading audio');
            }

            recordBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>`;
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.classList.add('recording');
          recordBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>`; 
        } catch (err) {
          alert('Microphone access denied or not available.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
          isRecording = false;
        }
      }
    });

    initAuth();
  </script>
</body>
</html>
