<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eliget Jobs — Find Work</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --text-muted: #64748B; --line: #E2E8F0; --green: #10B981; --green-dark: #059669; --blue: #3B82F6; }
    [data-theme="dark"] { --bg: #0B1120; --surface: #1E293B; --text: #F8FAFC; --text-muted: #94A3B8; --line: #334155; }
    [data-theme="dark"] body { background-color: var(--bg); color: var(--text); }
    [data-theme="dark"] .top-nav, [data-theme="dark"] .bottom-nav, [data-theme="dark"] .search-container, [data-theme="dark"] .job-card { background-color: var(--surface); border-color: var(--line); }
    [data-theme="dark"] .search-wrapper input { background-color: #0F172A; }
    [data-theme="dark"] .search-wrapper input:focus { background-color: var(--surface); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 70px; opacity: 0; transition: opacity 0.3s ease-in-out; }

    .top-nav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .logo { font-family: 'Archivo', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--text); }
    .logo span { color: var(--green); }
    .nav-icons { display: flex; align-items: center; gap: 12px; }
    .icon-btn-wrapper { width: 40px; height: 40px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; transition: background 0.2s; }
    .icon-btn-wrapper:hover { background: #F1F5F9; }
    .icon-btn-wrapper svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .search-container { position: sticky; top: 65px; z-index: 90; background: var(--surface); padding: 10px 20px; border-bottom: 1px solid var(--line); max-width: 600px; margin: 0 auto; }
    .search-wrapper { position: relative; width: 100%; }
    .search-wrapper svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .search-wrapper input { width: 100%; padding: 12px 14px 12px 42px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-family: inherit; font-size: 0.95rem; color: var(--text); outline: none; transition: all 0.2s; }
    .search-wrapper input:focus { border-color: var(--green); background: var(--surface); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }

    .container { max-width: 600px; margin: 0 auto; padding: 15px 20px; display: flex; flex-direction: column; min-height: calc(100vh - 150px); }

    .job-card { background: var(--surface); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 20px; border: 1px solid var(--line); }
    .job-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .header-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #E2E8F0; background-size: cover; background-position: center; border: 2px solid var(--green); flex-shrink: 0; }
    .avatar-text { display: flex; justify-content: center; align-items: center; background: var(--green); color: white; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 1.2rem; }
    
    .job-header h4 { font-size: 1rem; color: var(--text); display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .job-header .username { font-size: 0.85rem; color: var(--text-muted); display: block; }

    .badge-icon { width: 16px; height: 16px; fill: var(--blue); vertical-align: text-bottom; }

    .job-content { font-size: 1rem; color: var(--text); line-height: 1.6; margin-bottom: 15px; white-space: pre-wrap; word-break: break-word; }
    .job-content a { color: var(--green); font-weight: 600; text-decoration: none; }
    
    .job-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--line); }
    .job-date { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    
    .btn-message { background: var(--green); color: white; border: none; padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
    .btn-message:hover { background: var(--green-dark); }
    .btn-message svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .empty-state svg { width: 80px; height: 80px; stroke: #CBD5E1; margin-bottom: 15px; }
    .empty-state p { font-size: 1rem; font-weight: 500; margin-bottom: 20px; }
    .btn-create-post { display: inline-block; padding: 12px 24px; background: var(--green); color: white; text-decoration: none; border-radius: 999px; font-weight: 600; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: background 0.2s; }
    .btn-create-post:hover { background: var(--green-dark); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 65px; z-index: 1000; max-width: 600px; margin: 0 auto; box-shadow: 0 -1px 2px rgba(0,0,0,0.05); }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.58rem; font-weight: 600; gap: 4px; flex: 1; position: relative; transition: color 0.2s; }
    .nav-item.active { color: var(--green); }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.plus-btn { flex: 0.5; }
    .nav-item.plus-btn .plus-circle { position: absolute; top: -30px; width: 56px; height: 56px; border-radius: 50%; background: var(--green); display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); transition: transform 0.2s; }
    .nav-item.plus-btn:hover .plus-circle { transform: scale(1.05); }
    .nav-item.plus-btn svg { width: 28px; height: 28px; stroke: white; stroke-width: 3; }
    .nav-item.profile-nav .profile-pic { width: 26px; height: 26px; border-radius: 50%; background: #ccc; background-size: cover; background-position: center; border: 2px solid transparent; }
    .nav-item.profile-nav.active .profile-pic { border-color: var(--green); }
    
    .nav-icon-wrapper { position: relative; display: flex; justify-content: center; align-items: center; width: 24px; height: 24px; }
    .chat-badge { position: absolute; top: -6px; right: -10px; background: #EF4444; color: white; font-size: 0.55rem; font-weight: 700; padding: 2px 5px; border-radius: 999px; min-width: 16px; text-align: center; border: 2px solid var(--surface); }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="logo">Eliget <span>Jobs</span></div>
    <div class="nav-icons">
      <div class="icon-btn-wrapper" onclick="window.location.href='/notifications.html'">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </div>
    </div>
  </div>

  <div class="search-container">
    <div class="search-wrapper">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="jobSearchInput" placeholder="Search for jobs...">
    </div>
  </div>

  <div class="container">
    <div id="jobsContainer" style="flex:1;"></div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
      Jobs
    </a>
    <a href="/home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Home
    </a>
    <a href="/create-post.html" class="nav-item plus-btn">
      <div class="plus-circle">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
    </a>
    <a href="/chat.html" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span class="chat-badge" id="navChatBadge" style="display:none;">0</span>
      </div>
      Chats
    </a>
    <a href="/dashboard.html" class="nav-item profile-nav" id="navProfileBtn">
      <div class="profile-pic" id="navProfilePic"></div>
    </a>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/theme.js"></script>
  <script src="/splash.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { document.body.style.opacity = '1'; });

    let user = null;
    let socket = null;

    function getBadgeSVG(author) {
      if (author && author.badge && author.followers && author.followers.length >= 100) {
        return `<svg class="badge-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;
      }
      return '';
    }

    function formatContent(text) {
      if (!text) return '';
      let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return safeText;
    }

    function getAvatarHTML(author) {
      if (!author) return '';
      if (author.profilePic) return `<div class="avatar" style="background-image: url('${author.profilePic}')"></div>`;
      return `<div class="avatar avatar-text">${author.fullName.charAt(0).toUpperCase()}</div>`;
    }

    async function initAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error();
        const data = await res.json();
        user = data.user;
        
        const navPic = document.getElementById('navProfilePic');
        if (user.profilePic) navPic.style.backgroundImage = `url(${user.profilePic})`;
        else { navPic.style.background = '#10B981'; navPic.innerText = user.fullName.charAt(0).toUpperCase(); }

        setupSocket();
        loadJobs();
      } catch (err) {
        window.location.href = '/login.html';
      }
    }

    function setupSocket() {
      socket = io();
      socket.on('newChatMessage', () => {
        fetch('/api/chat/unread').then(r => r.json()).then(data => {
          const badge = document.getElementById('navChatBadge');
          if (badge && data.unreadCount > 0) {
            badge.style.display = 'block';
            badge.innerText = data.unreadCount;
          }
        });
      });
    }

    async function loadJobs(searchQuery = '') {
      const container = document.getElementById('jobsContainer');
      container.innerHTML = '<p style="text-align:center; padding:20px;">Loading jobs...</p>';
      
      try {
        const url = searchQuery ? `/api/posts/jobs?search=${encodeURIComponent(searchQuery)}` : '/api/posts/jobs';
        const res = await fetch(url);
        const jobs = await res.json();

        if (jobs.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            <p>No jobs found${searchQuery ? ' for your search' : ''}.</p>
            <a href="/create-post.html" class="btn-create-post">Post a Job</a>
          </div>`;
          return;
        }

        container.innerHTML = jobs.map(job => {
          const time = new Date(job.createdAt).toLocaleDateString();
          return `
            <div class="job-card">
              <div class="job-header">
                <div class="header-left" onclick="window.location.href='/profile.html?id=${job.author._id}'">
                  ${getAvatarHTML(job.author)}
                  <div>
                    <h4>${job.author.fullName} ${getBadgeSVG(job.author)}</h4>
                    <span class="username">@${job.author.username}</span>
                  </div>
                </div>
              </div>
              <div class="job-content">${formatContent(job.content)}</div>
              <div class="job-footer">
                <span class="job-date">Posted: ${time}</span>
                <button class="btn-message" onclick="navigateWithSplash('/chat-room.html?id=${job.author._id}', 'Loading Chatroom...')">
                  <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                  Message Employer
                </button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; color:red;">Failed to load jobs.</p>';
      }
    }

    let searchTimeout = null;
    document.getElementById('jobSearchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        loadJobs(e.target.value.trim());
      }, 500);
    });

    initAuth();
  </script>
</body>
</html>
