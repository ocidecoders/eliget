<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- FIX: Title too short -->
  <title>Login to Eliget - Anti-Addiction Social Media</title>
  <!-- FIX: Meta Description missing -->
  <meta name="description" content="Log in to Eliget, the anti-addiction, no-algorithm, text-focused social media platform. Connect with creators, freelancers, and thinkers.">

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10B981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/favicon.svg">

  <!-- Bing Verification -->
  <meta name="msvalidate.01" content="548513EF12C6687B4259E20BBB79D6B8" />

  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --text-muted: #64748B; --line: #E2E8F0; --green: #10B981; --green-dark: #059669; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: var(--text); }
    .login-box { background: var(--surface); width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--line); text-align: center; }

    /* FIX: Changed to h1 tag */
    h1.logo { font-family: 'Archivo', sans-serif; font-size: 2.5rem; font-weight: 900; color: var(--text); margin-bottom: 5px; letter-spacing: -1px; }
    h1.logo span { color: var(--green); }
    .subtitle { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 30px; }

    .form-group { margin-bottom: 18px; text-align: left; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; font-family: inherit; font-size: 1rem; outline: none; background: var(--bg); color: var(--text); transition: all 0.2s; }
    .form-group input:focus { border-color: var(--green); background: var(--surface); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }

    .btn-login { width: 100%; padding: 14px; background: var(--green); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
    .btn-login:hover { background: var(--green-dark); }
    .btn-login:active { transform: scale(0.98); }

    .error-msg { color: #EF4444; font-size: 0.85rem; margin-top: 10px; display: none; text-align: left; }
    .bottom-link { margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
    .bottom-link a { color: var(--green); font-weight: 600; text-decoration: none; }
    .bottom-link a:hover { text-decoration: underline; }

    .divider { display: flex; align-items: center; margin: 20px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .divider span { padding: 0 10px; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; }
  </style>
</head>
<body>

  <div class="login-box">
    <!-- FIX: Changed to h1 -->
    <h1 class="logo">Eli<span>get</span></h1>
    <div class="subtitle">Log in to your anti-addiction network.</div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="@username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <button class="btn-login" id="loginBtn">Log In</button>

    <div class="divider"><span>OR</span></div>

    <div class="bottom-link">
      Don't have an account? <a href="/register.html">Sign Up</a>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Register Error', err));
    }

    const errorMsg = document.getElementById('errorMsg');
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');

      if (!username || !password) {
        errorMsg.innerText = 'Please enter username and password.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.innerText = 'Logging in...';
      btn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('eliget_user', JSON.stringify(data.user));
          window.location.href = '/home.html';
        } else {
          errorMsg.innerText = data.message || 'Login failed';
          errorMsg.style.display = 'block';
          btn.innerText = 'Log In';
          btn.disabled = false;
        }
      } catch (err) {
        errorMsg.innerText = 'Server error. Please try again.';
        errorMsg.style.display = 'block';
        btn.innerText = 'Log In';
        btn.disabled = false;
      }
    });

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>
</body>
</html>
