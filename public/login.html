<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eliget - Anti-Addiction Social Media</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F3F4F6; --surface: #FFFFFF; --text: #111827; --text-muted: #6B7280; --line: #E5E7EB; --green: #10B981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .login-box { background: var(--surface); width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
    .logo { font-family: 'Archivo', sans-serif; font-size: 2.5rem; font-weight: 900; color: var(--text); margin-bottom: 10px; }
    .logo span { color: var(--green); }
    .subtitle { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 30px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 15px; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; font-size: 1rem; outline: none; background: var(--bg); color: var(--text); }
    .form-group input:focus { border-color: var(--green); background: var(--surface); }
    .btn-login { width: 100%; padding: 14px; background: var(--green); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-login:hover { background: #059669; }
    .bottom-link { margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
    .bottom-link a { color: var(--green); font-weight: 600; text-decoration: none; }
    
    /* Dark Theme */
    [data-theme="dark"] { --bg: #111827; --surface: #1F2937; --text: #F9FAFB; --text-muted: #9CA3AF; --line: #374151; }
    [data-theme="dark"] body { background-color: var(--bg); color: var(--text); }
    [data-theme="dark"] .login-box { background: var(--surface); border-color: var(--line); }
    [data-theme="dark"] input { background: var(--bg); color: var(--text); border-color: var(--line); }
    [data-theme="dark"] input:focus { background: var(--surface); }
  </style>

  <!-- Favicon & SEO -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
</head>
<body>

  <div class="login-box">
    <div class="logo">Eli<span>get</span></div>
    <div class="subtitle">Anti-addiction, no-algorithm social media.</div>
    
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="@username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    
    <button class="btn-login" id="loginBtn">Log In</button>
    
    <div class="bottom-link">
      Don't have an account? <a href="/register.html">Sign Up</a>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');

      if (!username || !password) return alert('Please enter username and password.');

      btn.innerText = 'Logging in...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('eliget_user', JSON.stringify(data.user));
          window.location.href = '/home.html';
        } else {
          alert(data.message || 'Login failed');
          btn.innerText = 'Log In';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Server error. Please try again.');
        btn.innerText = 'Log In';
        btn.disabled = false;
      }
    });

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>
</body>
</html>
