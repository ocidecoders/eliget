<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notifications — Eliget</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">
  <style>
    :root { --bg: #F3F4F6; --surface: #FFFFFF; --text: #111827; --text-muted: #6B7280; --line: #E5E7EB; --green: #10B981; --blue: #3B82F6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 70px; }

    .top-nav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; padding: 5px; border-radius: 50%; }
    .back-btn svg { width: 24px; height: 24px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo { font-family: 'Archivo', sans-serif; font-size: 1.3rem; font-weight: 900; color: var(--text); }
    .logo span { color: var(--green); }

    .container { max-width: 600px; margin: 0 auto; padding: 20px; }

    .notification-item { background: var(--surface); padding: 15px 20px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: background 0.2s; border: 1px solid var(--line); }
    .notification-item.unread { background: #ecfdf5; border-color: #a7f3d0; }
    .notification-item:hover { background: var(--bg); }

    .notif-avatar { width: 44px; height: 44px; border-radius: 50%; background: #E5E7EB; background-size: cover; background-position: center; flex-shrink: 0; }
    .notif-content { flex: 1; }
    .notif-text { font-size: 0.95rem; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
    .notif-text strong { font-weight: 600; }
    .notif-time { font-size: 0.75rem; color: var(--text-muted); }
    
    .notif-icon { display: flex; justify-content: center; align-items: center; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
    .notif-icon.like { background: #FEE2E2; }
    .notif-icon.like svg { stroke: #EF4444; fill: #EF4444; }
    .notif-icon.comment { background: #DBEAFE; }
    .notif-icon.comment svg { stroke: var(--blue); }
    .notif-icon.follow { background: #F3E8FF; }
    .notif-icon.follow svg { stroke: #8B5CF6; }
    .notif-icon svg { width: 16px; height: 16px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state svg { width: 80px; height: 80px; stroke: #D1D5DB; margin-bottom: 15px; }
    .empty-state p { font-size: 0.95rem; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 65px; z-index: 1000; max-width: 600px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #9CA3AF; font-size: 0.58rem; font-weight: 600; gap: 4px; flex: 1; position: relative; }
    .nav-item.active { color: var(--green); }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.plus-btn { flex: 0.5; }
    .nav-item.plus-btn .plus-circle { position: absolute; top: -30px; width: 56px; height: 56px; border-radius: 50%; background: var(--green); display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); transition: transform 0.2s; }
    .nav-item.plus-btn svg { width: 28px; height: 28px; stroke: white; stroke-width: 3; }
    .nav-item.profile-nav .profile-pic { width: 26px; height: 26px; border-radius: 50%; background: #ccc; background-size: cover; background-position: center; border: 2px solid transparent; }
    .nav-item.profile-nav.active .profile-pic { border-color: var(--green); }
  
    /* Chat Badge */
    .chat-badge { position: absolute; top: -2px; right: 15px; background: #EF4444; color: white; font-size: 0.6rem; font-weight: 700; padding: 2px 5px; border-radius: 999px; min-width: 16px; text-align: center; border: 2px solid var(--surface); }
  
    .avatar-text { display: flex; justify-content: center; align-items: center; background: var(--green); color: white; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 1.2rem; }
  
    /* Dark Theme Styles */
    [data-theme="dark"] {
      --bg: #111827;
      --surface: #1F2937;
      --text: #F9FAFB;
      --text-muted: #9CA3AF;
      --line: #374151;
    }
    [data-theme="dark"] body { background-color: var(--bg); color: var(--text); }
    [data-theme="dark"] .top-nav, [data-theme="dark"] .bottom-nav, [data-theme="dark"] .search-container, [data-theme="dark"] .post-card, [data-theme="dark"] .settings-card, [data-theme="dark"] .job-card, [data-theme="dark"] .comment-body, [data-theme="dark"] .modal-box, [data-theme="dark"] .chat-item, [data-theme="dark"] .notification-item, [data-theme="dark"] .comments-box, [data-theme="dark"] .login-box { background-color: var(--surface); border-color: var(--line); }
    [data-theme="dark"] input, [data-theme="dark"] textarea { background-color: var(--bg); color: var(--text); border-color: var(--line); }
    [data-theme="dark"] input:focus, [data-theme="dark"] textarea:focus { background-color: var(--surface); }
    [data-theme="dark"] .dropdown-menu { background-color: var(--surface); border-color: var(--line); }
    [data-theme="dark"] .dropdown-item:hover { background-color: var(--bg); }
    [data-theme="dark"] .icon-btn-wrapper { background-color: var(--bg); border-color: var(--line); }
    [data-theme="dark"] .icon-btn-wrapper:hover { background-color: var(--line); }
    [data-theme="dark"] .logo { color: var(--text); }
    [data-theme="dark"] .search-wrapper input { background-color: var(--bg); }
    [data-theme="dark"] .search-wrapper input:focus { background-color: var(--surface); }
    [data-theme="dark"] .settings-btn:hover, [data-theme="dark"] .menu-btn:hover { background-color: var(--bg); }
    [data-theme="dark"] .settings-btn svg, [data-theme="dark"] .menu-btn svg { stroke: var(--text-muted); }
    [data-theme="dark"] .avatar-text, [data-theme="dark"] .search-user-avatar { background-color: var(--green); }
    [data-theme="dark"] .user-list-item:hover { background-color: var(--bg); }
    [data-theme="dark"] .post-content a { color: var(--green); }
    [data-theme="dark"] ::-webkit-scrollbar { width: 8px; }
    [data-theme="dark"] ::-webkit-scrollbar-track { background: var(--bg); }
    [data-theme="dark"] ::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }

  </style>

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">

  <!-- SEO Meta Tags -->
  <meta name="description" content="Eliget - An anti-addiction, no-algorithm, text-focused social media platform. No infinite scrolling, no short videos. Just pure connections.">
  <meta name="keywords" content="Eliget, social media, anti-addiction, no algorithm, text social media, social network, ocidecoders">
  <meta name="author" content="Ocide Coders">
  <meta property="og:title" content="Eliget - Anti-Addiction Social Media">
  <meta property="og:description" content="An anti-addiction, no-algorithm, text-focused social media platform.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eliget-social.onrender.com">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google & Bing Verification (Replace the content values after getting them from search console) -->
  <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_CODE_HERE" />
  <meta name="msvalidate.01" content="YOUR_BING_VERIFICATION_CODE_HERE" />

</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.history.back()">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="logo">Notifi<span>cations</span>
    
</div>
  </div>

  <div class="container" id="notificationsContainer">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <p>Loading notifications...</p>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
      Jobs
    </a>
    <a href="/home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Home
    </a>
    <a href="/create-post.html" class="nav-item plus-btn">
      <div class="plus-circle">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
    </a>
    <a href="/chat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Chats
    
      <span class="chat-badge" id="navChatBadge" style="display:none;">0</span>
    </a>
    <a href="/dashboard.html" class="nav-item profile-nav" id="navProfileBtn">
      <div class="profile-pic" id="navProfilePic"></div>
    </a>
  </div>

  <script>
    let user = null;
    async function initAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error();
        const data = await res.json();
        user = data.user;
        localStorage.setItem('eliget_user', JSON.stringify(user));
        if(user.profilePic) document.getElementById('navProfilePic').style.backgroundImage = `url(${user.profilePic})`;
        loadNotifications();
      } catch (err) {
        localStorage.removeItem('eliget_user');
        window.location.href = '/login.html';
      }
    }

    function timeAgo(dateParam) {
      const date = new Date(dateParam);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "y ago";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "mo ago";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "d ago";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "h ago";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "m ago";
      return Math.floor(seconds) + "s ago";
    }

    async function loadNotifications() {
      const container = document.getElementById('notificationsContainer');
      try {
        const res = await fetch(`/api/notifications/${user.id}`);
        const notifications = await res.json();

        await fetch(`/api/notifications/${user.id}/read`, { method: 'POST' });

        if (notifications.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              <p>No notifications yet.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = notifications.map(notif => {
          let text = '';
          let link = '#';
          let iconSVG = '';

          if (notif.type === 'like') {
            text = `<strong>${notif.sender.fullName}</strong> liked your post.`;
            link = `/home.html`; 
            iconSVG = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
          } else if (notif.type === 'comment') {
            text = `<strong>${notif.sender.fullName}</strong> commented on your post.`;
            link = `/home.html`;
            iconSVG = `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>`;
          } else if (notif.type === 'follow') {
            text = `<strong>${notif.sender.fullName}</strong> started following you.`;
            link = `/profile.html?id=${notif.sender._id}`;
            iconSVG = `<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>`;
          }

          return `
            <div class="notification-item ${notif.isRead ? '' : 'unread'}" onclick="window.location.href='${link}'">
              <div class="notif-avatar" style="background-image: url('${notif.sender.profilePic || ''}')"></div>
              <div class="notif-content">
                <div class="notif-text">${text}</div>
                <div class="notif-time">${timeAgo(notif.createdAt)}</div>
              </div>
              <div class="notif-icon ${notif.type}">
                ${iconSVG}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; color:red;">Failed to load notifications.</p>';
      }
    }

    initAuth();
  
    // Fetch Chat Badge
    async function fetchChatBadge() {
      try {
        const res = await fetch('/api/chat/unread');
        const data = await res.json();
        const badge = document.getElementById('navChatBadge');
        if (badge && data.unreadCount > 0) {
          badge.style.display = 'block';
          badge.innerText = data.unreadCount > 99 ? '99+' : data.unreadCount;
        }
      } catch (err) { console.error(err); }
    }
    fetchChatBadge();
  
  </script>
<script src="/anti-addiction.js"></script>
<script src="/theme.js"></script>
</body>
</html>
