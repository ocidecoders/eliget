<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile — Eliget</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">
  <style>
    :root { --bg: #F3F4F6; --surface: #FFFFFF; --text: #111827; --text-muted: #6B7280; --line: #E5E7EB; --green: #10B981; --blue: #3B82F6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 70px; }

    .top-nav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; padding: 5px; border-radius: 50%; }
    .back-btn svg { width: 24px; height: 24px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo { font-family: 'Archivo', sans-serif; font-size: 1.3rem; font-weight: 900; color: var(--text); }
    .logo span { color: var(--green); }

    .cover-container { width: 100%; height: 140px; background: #000000; background-size: cover; background-position: center; }
    .profile-info-container { max-width: 600px; margin: 0 auto; padding: 0 20px; position: relative; margin-top: -50px; }
    .avatar-wrapper { position: relative; width: 100px; height: 100px; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; background: #E5E7EB; background-size: cover; background-position: center; border: 4px solid var(--surface); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    .user-details { margin-top: 15px; margin-bottom: 20px; }
    .user-details h1 { font-family: 'Archivo', sans-serif; font-size: 1.6rem; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .user-details .username { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; display: block; }
    
    .stats { display: flex; gap: 20px; margin-top: 15px; }
    .stat-item { font-size: 0.95rem; color: var(--text-muted); }
    .stat-item strong { color: var(--text); font-weight: 700; }

    .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .btn-action { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; border: none; transition: all 0.2s; }
    .btn-follow { background: var(--green); color: white; }
    .btn-unfollow { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
    .btn-message { background: var(--blue); color: white; }
    .btn-action svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .posts-section { max-width: 600px; margin: 0 auto; padding: 0 20px; margin-top: 20px; }
    .section-title { font-family: 'Archivo', sans-serif; font-size: 1.2rem; color: var(--text); border-bottom: 2px solid var(--line); padding-bottom: 10px; margin-bottom: 15px; }
    .post-card { background: var(--surface); padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 15px; border: 1px solid var(--line); }
    .post-content { font-size: 1rem; color: var(--text); line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
    .post-image { width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid var(--line); }
    
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); }
    .action-left { display: flex; gap: 20px; align-items: center; }
    .action-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; font-family: inherit; padding: 5px; }
    .action-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .action-btn.liked { color: #EF4444; }
    .action-btn.liked svg { fill: #EF4444; stroke: #EF4444; }
    .view-count { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }

    .empty-posts { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 0.95rem; }
    .svg-badge { width: 22px; height: 22px; }

    #commentsModal { align-items: flex-end; padding: 0; }
    .comments-box { background: var(--surface); width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; height: 75vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .comments-header { padding: 15px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .comments-header h3 { font-family: 'Archivo', sans-serif; font-size: 1.1rem; }
    .close-btn { background: none; border: none; cursor: pointer; padding: 5px; }
    .close-btn svg { width: 20px; height: 20px; stroke: var(--text-muted); stroke-width: 2; }
    .comments-list { flex: 1; overflow-y: auto; padding: 20px; }
    
    .comment-item { display: flex; gap: 12px; margin-bottom: 15px; }
    .comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: #E5E7EB; background-size: cover; background-position: center; flex-shrink: 0; }
    .comment-body { flex: 1; background: var(--bg); padding: 10px 14px; border-radius: 0 12px 12px 12px; position: relative; }
    .comment-body h5 { font-size: 0.85rem; color: var(--text); margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
    .comment-body p { font-size: 0.9rem; color: var(--text); line-height: 1.4; word-break: break-word; }
    
    .comment-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; }
    .comment-action-btn { background: none; border: none; cursor: pointer; color: #9CA3AF; padding: 2px; }
    .comment-action-btn:hover { color: var(--text); }
    .comment-action-btn.delete:hover { color: #EF4444; }
    .comment-action-btn.pin:hover { color: var(--green); }
    .comment-action-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    .pinned-indicator { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--green); font-weight: 600; margin-bottom: 5px; }
    .pinned-indicator svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

    .comment-input-area { padding: 15px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; background: var(--surface); padding-bottom: 20px; }
    .comment-input-area input { flex: 1; padding: 12px 15px; border: 1px solid var(--line); border-radius: 999px; font-family: inherit; font-size: 0.95rem; outline: none; background: var(--bg); }
    .comment-input-area input:focus { border-color: var(--green); background: var(--surface); }
    .btn-send { background: var(--green); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
    .btn-send svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-left: -2px; margin-top: 2px; }
    .empty-comments { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 0.95rem; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; height: 65px; z-index: 1000; max-width: 600px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #9CA3AF; font-size: 0.58rem; font-weight: 600; gap: 4px; flex: 1; position: relative; }
    .nav-item.active { color: var(--green); }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.plus-btn { flex: 0.5; }
    .nav-item.plus-btn .plus-circle { position: absolute; top: -30px; width: 56px; height: 56px; border-radius: 50%; background: var(--green); display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); transition: transform 0.2s; }
    .nav-item.plus-btn svg { width: 28px; height: 28px; stroke: white; stroke-width: 3; }
    .nav-item.profile-nav .profile-pic { width: 26px; height: 26px; border-radius: 50%; background: #ccc; background-size: cover; background-position: center; border: 2px solid transparent; }
    .nav-item.profile-nav.active .profile-pic { border-color: var(--green); }
  
    /* Chat Badge */
    .chat-badge { position: absolute; top: -2px; right: 15px; background: #EF4444; color: white; font-size: 0.6rem; font-weight: 700; padding: 2px 5px; border-radius: 999px; min-width: 16px; text-align: center; border: 2px solid var(--surface); }
  
    .avatar-text { display: flex; justify-content: center; align-items: center; background: var(--green); color: white; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 1.2rem; }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.history.back()">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="logo">Eli<span>get</span></div>
  </div>

  <div class="cover-container" id="targetCover"></div>

  <div class="profile-info-container">
    <div class="avatar-wrapper">
      <div class="avatar" id="targetAvatar"></div>
    </div>

    <div class="user-details">
      <h1 id="targetName">Loading...</h1>
      <span class="username" id="targetUsername"></span>
      <div class="stats">
        <div class="stat-item"><strong id="followersCount">0</strong> Followers</div>
        <div class="stat-item"><strong id="followingCount">0</strong> Following</div>
      </div>
    </div>

    <div class="action-buttons" id="actionButtons"></div>
  </div>

  <div class="posts-section">
    <h2 class="section-title">Posts</h2>
    <div id="targetPostsContainer">
      <p class="empty-posts">Loading posts...</p>
    </div>
  </div>

  <div class="modal-overlay" id="commentsModal">
    <div class="comments-box">
      <div class="comments-header">
        <h3>Comments</h3>
        <button class="close-btn" onclick="closeCommentsModal()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <div class="comment-input-area">
        <input type="text" id="commentInput" placeholder="Write a comment..." autocomplete="off">
        <button class="btn-send" id="submitCommentBtn">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/jobs.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
      Jobs
    </a>
    <a href="/home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Home
    </a>
    <a href="/create-post.html" class="nav-item plus-btn">
      <div class="plus-circle">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
    </a>
    <a href="/chat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Chats
    
      <span class="chat-badge" id="navChatBadge" style="display:none;">0</span>
    </a>
    <a href="/dashboard.html" class="nav-item profile-nav" id="navProfileBtn">
      <div class="profile-pic" id="navProfilePic"></div>
    </a>
  </div>

  <script>
    let currentUser = null;
    async function initAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error();
        const data = await res.json();
        currentUser = data.user;
        localStorage.setItem('eliget_user', JSON.stringify(currentUser));
        
        
        const navPic = document.getElementById('navProfilePic');
        if (currentUser.profilePic) navPic.style.backgroundImage = `url(${currentUser.profilePic})`;
        else { navPic.style.background = '#10B981'; navPic.innerText = currentUser.fullName.charAt(0).toUpperCase(); }
  
        
        initPage();
      } catch (err) {
        localStorage.removeItem('eliget_user');
        window.location.href = '/login.html';
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id');
    
    function initPage() {
      if (!targetUserId) window.location.href = '/home.html';
      if (targetUserId === currentUser.id) window.location.href = '/dashboard.html';
      loadProfile();
      loadTargetPosts();
    }

    const badgeSVGs = {
      "Singer": `<svg class="svg-badge" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`,
      "Freelancer": `<svg class="svg-badge" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`,
      "Business": `<svg class="svg-badge" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>`,
      "Writer": `<svg class="svg-badge" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>`,
      "General": `<svg class="svg-badge" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`
    };

    async function loadProfile() {
      try {
        const res = await fetch(`/api/user/profile/${targetUserId}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const target = data.user;
        document.getElementById('targetName').innerHTML = `${target.fullName} ${badgeSVGs[target.badge || 'General']}`;
        document.getElementById('targetUsername').innerText = '@' + target.username;
        document.getElementById('followersCount').innerText = data.followersCount;
        document.getElementById('followingCount').innerText = data.followingCount;
        
        if (target.profilePic) document.getElementById('targetAvatar').style.backgroundImage = `url(${target.profilePic})`;
        if (target.coverPic) document.getElementById('targetCover').style.backgroundImage = `url(${target.coverPic})`;

        renderButtons(data.isFollowing, data.isMutual);
      } catch (err) { alert('Failed to load profile'); window.location.href = '/home.html'; }
    }

    function renderButtons(isFollowing, isMutual) {
      const container = document.getElementById('actionButtons');
      if (isMutual) {
        container.innerHTML = `<button class="btn-action btn-message" onclick="window.location.href='/chat-room.html?id=${targetUserId}'"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> Message</button>`;
      } else if (isFollowing) {
        container.innerHTML = `<button class="btn-action btn-unfollow" id="followBtn"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle><line x1="1" y1="1" x2="23" y2="23"></line></svg> Following</button>`;
      } else {
        container.innerHTML = `<button class="btn-action btn-follow" id="followBtn"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg> Follow</button>`;
      }
      const btn = document.getElementById('followBtn');
      if (btn) btn.addEventListener('click', toggleFollow);
    }

    async function toggleFollow() {
      const btn = document.getElementById('followBtn');
      btn.disabled = true;
      const isCurrentlyFollowing = btn.classList.contains('btn-unfollow');
      const endpoint = isCurrentlyFollowing ? 'unfollow' : 'follow';
      try {
        const res = await fetch(`/api/user/${endpoint}/${targetUserId}`, { method: 'POST' });
        if (res.ok) loadProfile();
        else { alert('Action failed'); btn.disabled = false; }
      } catch (err) { alert('Server error'); btn.disabled = false; }
    }

    const viewTimers = new Map();
    let observer = null;
    const COOLDOWN_MS = 30 * 60 * 1000; 
    function setupViewTracking() {
      if (observer) observer.disconnect();
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const postId = entry.target.dataset.postId;
          if (entry.isIntersecting) {
            if (!viewTimers.has(postId)) {
              const timer = setTimeout(() => {
                viewTimers.delete(postId);
                const lastViewed = localStorage.getItem(`viewed_${postId}`);
                const now = Date.now();
                if (!lastViewed || (now - parseInt(lastViewed)) > COOLDOWN_MS) {
                  localStorage.setItem(`viewed_${postId}`, now);
                  fetch(`/api/posts/${postId}/view`, { method: 'POST' }).catch(() => {});
                }
              }, 2000);
              viewTimers.set(postId, timer);
            }
          } else {
            if (viewTimers.has(postId)) { clearTimeout(viewTimers.get(postId)); viewTimers.delete(postId); }
          }
        });
      }, { threshold: 0.5 });
      document.querySelectorAll('.post-card').forEach(card => observer.observe(card));
    }

    let allTargetPosts = [];
    let currentPostIdForComment = null;
    let currentPostAuthorId = null;

    async function loadTargetPosts() {
      const container = document.getElementById('targetPostsContainer');
      try {
        const res = await fetch(`/api/posts/user/${targetUserId}`);
        allTargetPosts = await res.json();
        if (allTargetPosts.length === 0) { container.innerHTML = `<p class="empty-posts">No posts yet.</p>`; return; }
        
        container.innerHTML = allTargetPosts.map(post => {
          const isLiked = post.likes && post.likes.includes(currentUser.id);
          const likesCount = post.likes ? post.likes.length : 0;
          const viewsCount = post.views || 0;
          const commentCount = post.commentCount || 0;

          return `
          <div class="post-card" data-post-id="${post._id}">
            <div class="post-content">${post.content}</div>
            ${post.image ? `<img src="${post.image}" class="post-image">` : ''}
            <div class="action-bar">
              <div class="action-left">
                <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post._id}')" id="like-btn-${post._id}">
                  <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                  <span id="like-count-${post._id}">${likesCount}</span>
                </button>
                <button class="action-btn" onclick="openCommentsModal('${post._id}', '${post.author._id}')">
                  <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                  <span id="comment-count-${post._id}">${commentCount}</span>
                </button>
              </div>
              <div class="view-count">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span id="view-count-${post._id}">${viewsCount}</span>
              </div>
            </div>
          </div>
        `}).join('');
        setupViewTracking();
      } catch (err) { container.innerHTML = `<p class="empty-posts">Failed to load posts.</p>`; }
    }

    async function toggleLike(postId) {
      const btn = document.getElementById(`like-btn-${postId}`);
      const countSpan = document.getElementById(`like-count-${postId}`);
      const isCurrentlyLiked = btn.classList.contains('liked');
      if (isCurrentlyLiked) { btn.classList.remove('liked'); countSpan.innerText = parseInt(countSpan.innerText) - 1; }
      else { btn.classList.add('liked'); countSpan.innerText = parseInt(countSpan.innerText) + 1; }
      try {
        const res = await fetch(`/api/posts/${postId}/like`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          countSpan.innerText = data.likes.length;
          if (data.likes.includes(currentUser.id)) btn.classList.add('liked'); else btn.classList.remove('liked');
        } else { loadTargetPosts(); }
      } catch (err) { loadTargetPosts(); }
    }

    function openCommentsModal(postId, postAuthorId) {
      currentPostIdForComment = postId;
      currentPostAuthorId = postAuthorId;
      document.getElementById('commentsModal').classList.add('show');
      document.getElementById('commentInput').value = '';
      loadComments(postId);
    }
    function closeCommentsModal() { document.getElementById('commentsModal').classList.remove('show'); currentPostIdForComment = null; currentPostAuthorId = null; }

    async function loadComments(postId) {
      const list = document.getElementById('commentsList');
      list.innerHTML = '<p style="text-align:center; color:#6B7280; font-size:0.9rem;">Loading...</p>';
      try {
        const res = await fetch(`/api/posts/${postId}/comments`);
        const comments = await res.json();
        if (comments.length === 0) { list.innerHTML = `<p class="empty-comments">No comments yet. Be the first!</p>`; return; }
        const isPostOwner = currentUser.id === currentPostAuthorId;
        list.innerHTML = comments.map(c => {
          const isCommentOwner = c.author._id === currentUser.id;
          return `
          <div class="comment-item">
            <div class="comment-avatar" style="background-image: url('${c.author.profilePic || ''}')"></div>
            <div class="comment-body">
              ${c.isPinned ? `<div class="pinned-indicator"><svg viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>Pinned</div>` : ''}
              <h5>${c.author.fullName} ${badgeSVGs[c.author.badge || 'General']}</h5>
              <p>${c.content}</p>
              <div class="comment-actions">
                ${isPostOwner ? `<button class="comment-action-btn pin" onclick="togglePin('${c._id}', '${postId}')"><svg viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg></button>` : ''}
                ${isCommentOwner ? `<button class="comment-action-btn delete" onclick="deleteComment('${c._id}', '${postId}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>` : ''}
              </div>
            </div>
          </div>`}).join('');
        list.scrollTop = list.scrollHeight;
      } catch (err) { list.innerHTML = '<p style="text-align:center; color:red; font-size:0.9rem;">Failed to load comments.</p>'; }
    }

    document.getElementById('submitCommentBtn').addEventListener('click', async () => {
      const input = document.getElementById('commentInput');
      const content = input.value.trim();
      if (!content || !currentPostIdForComment) return;
      const btn = document.getElementById('submitCommentBtn');
      btn.disabled = true;
      try {
        const res = await fetch(`/api/posts/${currentPostIdForComment}/comments`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) });
        if (res.ok) { input.value = ''; const countSpan = document.getElementById(`comment-count-${currentPostIdForComment}`); if (countSpan) countSpan.innerText = parseInt(countSpan.innerText) + 1; loadComments(currentPostIdForComment); }
      } catch (err) {}
      btn.disabled = false;
    });
    async function deleteComment(commentId, postId) {
      if (!confirm('Delete this comment?')) return;
      try { const res = await fetch(`/api/comments/${commentId}`, { method: 'DELETE' }); if (res.ok) { const countSpan = document.getElementById(`comment-count-${postId}`); if (countSpan) countSpan.innerText = Math.max(0, parseInt(countSpan.innerText) - 1); loadComments(postId); } } catch (err) {}
    }
    async function togglePin(commentId, postId) {
      try { const res = await fetch(`/api/comments/${commentId}/pin`, { method: 'POST' }); const data = await res.json(); if (res.ok) loadComments(postId); else alert(data.message); } catch (err) {}
    }

    initAuth();
  
    // Fetch Chat Badge
    async function fetchChatBadge() {
      try {
        const res = await fetch('/api/chat/unread');
        const data = await res.json();
        const badge = document.getElementById('navChatBadge');
        if (badge && data.unreadCount > 0) {
          badge.style.display = 'block';
          badge.innerText = data.unreadCount > 99 ? '99+' : data.unreadCount;
        }
      } catch (err) { console.error(err); }
    }
    fetchChatBadge();
  
  </script>
</body>
</html>
