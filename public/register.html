<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Register — Eliget</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10B981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/favicon.svg">
  
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { 
      --bg: #F8FAFC; 
      --surface: #FFFFFF; 
      --text: #0F172A; 
      --text-muted: #64748B; 
      --line: #E2E8F0; 
      --green: #10B981; 
      --green-dark: #059669; 
    }
    [data-theme="dark"] { 
      --bg: #0B1120; 
      --surface: #1E293B; 
      --text: #F8FAFC; 
      --text-muted: #94A3B8; 
      --line: #334155; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: var(--text); }
    
    .register-box { background: var(--surface); width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid var(--line); text-align: center; }
    .logo { font-family: 'Archivo', sans-serif; font-size: 2.5rem; font-weight: 900; color: var(--text); margin-bottom: 5px; letter-spacing: -1px; }
    .logo span { color: var(--green); }
    .subtitle { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 30px; }
    
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; font-family: inherit; font-size: 1rem; outline: none; background: var(--bg); color: var(--text); transition: all 0.2s; }
    .form-group input:focus { border-color: var(--green); background: var(--surface); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
    
    .btn-register { width: 100%; padding: 14px; background: var(--green); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
    .btn-register:hover { background: var(--green-dark); }
    .btn-register:active { transform: scale(0.98); }
    
    .error-msg { color: #EF4444; font-size: 0.85rem; margin-top: 10px; display: none; text-align: left; }
    
    .bottom-link { margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
    .bottom-link a { color: var(--green); font-weight: 600; text-decoration: none; }
    .bottom-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="register-box">
    <div class="logo">Eli<span>get</span></div>
    <div class="subtitle">Join the no-algorithm network.</div>
    
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="fullName" placeholder="Your Name">
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="@username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
    </div>
    
    <div class="error-msg" id="errorMsg"></div>
    
    <button class="btn-register" id="registerBtn">Create Account</button>
    
    <div class="bottom-link">
      Already have an account? <a href="/login.html">Log In</a>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Register Error', err));
    }

    const errorMsg = document.getElementById('errorMsg');

    document.getElementById('registerBtn').addEventListener('click', async () => {
      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('registerBtn');

      if (!fullName || !username || !password) {
        errorMsg.innerText = 'Please fill all fields.';
        errorMsg.style.display = 'block';
        return;
      }
      if (password.length < 6) {
        errorMsg.innerText = 'Password must be at least 6 characters.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.innerText = 'Creating...';
      btn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, username, password })
        });
        const data = await res.json();

        if (res.ok) {
          btn.innerText = 'Success!';
          setTimeout(() => window.location.href = '/login.html', 1000);
        } else {
          errorMsg.innerText = data.message || 'Registration failed';
          errorMsg.style.display = 'block';
          btn.innerText = 'Create Account';
          btn.disabled = false;
        }
      } catch (err) {
        errorMsg.innerText = 'Server error. Please try again.';
        errorMsg.style.display = 'block';
        btn.innerText = 'Create Account';
        btn.disabled = false;
      }
    });

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('registerBtn').click();
    });
  </script>
</body>
</html>
