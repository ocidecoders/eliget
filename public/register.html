<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign Up — Eliget</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  
  
  
  
  <style>
    :root { --bg: #F3F4F6; --surface: #FFFFFF; --text: #111827; --text-muted: #6B7280; --line: #E5E7EB; --green: #10B981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-box { background: var(--surface); width: 100%; max-width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .logo { font-family: 'Archivo', sans-serif; font-size: 2rem; font-weight: 900; color: var(--text); text-align: center; margin-bottom: 5px; }
    .logo span { color: var(--green); }
    .subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #F9FAFB; font-family: inherit; font-size: 1rem; outline: none; transition: all 0.2s; }
    .form-group input:focus { border-color: var(--green); background: var(--surface); box-shadow: 0 0 0 3px #ecfdf5; }
    
    #usernameStatus { font-size: 0.8rem; margin-top: 5px; display: block; }
    .valid { color: var(--green); }
    .invalid { color: #EF4444; }

    .btn-login { width: 100%; background: var(--green); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .footer-text { text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-top: 20px; }
    .footer-text a { color: var(--green); text-decoration: none; font-weight: 600; }
    #errorMsg { color: #EF4444; font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 15px; display: none; }
  
    /* Dark Theme Styles */
    [data-theme="dark"] {
      --bg: #111827;
      --surface: #1F2937;
      --text: #F9FAFB;
      --text-muted: #9CA3AF;
      --line: #374151;
    }
    [data-theme="dark"] body { background-color: var(--bg); color: var(--text); }
    [data-theme="dark"] .top-nav, [data-theme="dark"] .bottom-nav, [data-theme="dark"] .search-container, [data-theme="dark"] .post-card, [data-theme="dark"] .settings-card, [data-theme="dark"] .job-card, [data-theme="dark"] .comment-body, [data-theme="dark"] .modal-box, [data-theme="dark"] .chat-item, [data-theme="dark"] .notification-item, [data-theme="dark"] .comments-box, [data-theme="dark"] .login-box { background-color: var(--surface); border-color: var(--line); }
    [data-theme="dark"] input, [data-theme="dark"] textarea { background-color: var(--bg); color: var(--text); border-color: var(--line); }
    [data-theme="dark"] input:focus, [data-theme="dark"] textarea:focus { background-color: var(--surface); }
    [data-theme="dark"] .dropdown-menu { background-color: var(--surface); border-color: var(--line); }
    [data-theme="dark"] .dropdown-item:hover { background-color: var(--bg); }
    [data-theme="dark"] .icon-btn-wrapper { background-color: var(--bg); border-color: var(--line); }
    [data-theme="dark"] .icon-btn-wrapper:hover { background-color: var(--line); }
    [data-theme="dark"] .logo { color: var(--text); }
    [data-theme="dark"] .search-wrapper input { background-color: var(--bg); }
    [data-theme="dark"] .search-wrapper input:focus { background-color: var(--surface); }
    [data-theme="dark"] .settings-btn:hover, [data-theme="dark"] .menu-btn:hover { background-color: var(--bg); }
    [data-theme="dark"] .settings-btn svg, [data-theme="dark"] .menu-btn svg { stroke: var(--text-muted); }
    [data-theme="dark"] .avatar-text, [data-theme="dark"] .search-user-avatar { background-color: var(--green); }
    [data-theme="dark"] .user-list-item:hover { background-color: var(--bg); }
    [data-theme="dark"] .post-content a { color: var(--green); }
    [data-theme="dark"] ::-webkit-scrollbar { width: 8px; }
    [data-theme="dark"] ::-webkit-scrollbar-track { background: var(--bg); }
    [data-theme="dark"] ::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }

  </style>

<body>

  <div class="login-box">
    <div class="logo">Eli<span>get</span></div>
    <div class="subtitle">Create your account.</div>
    
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="@username" required autocomplete="username">
        <span id="usernameStatus"></span>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-login" id="submitBtn" disabled>Sign Up</button>
      <div id="errorMsg"></div>
    </form>

    <div class="footer-text">
      Already have an account? <a href="/login.html">Log in</a>
    </div>
  </div>

  <script>
    let isUsernameAvailable = false;
    const usernameInput = document.getElementById('username');
    const statusMsg = document.getElementById('usernameStatus');
    const submitBtn = document.getElementById('submitBtn');

    let timeout = null;
    usernameInput.addEventListener('input', (e) => {
      clearTimeout(timeout);
      const username = e.target.value.trim().toLowerCase();
      if (!username) { statusMsg.innerText = ''; submitBtn.disabled = true; return; }

      timeout = setTimeout(async () => {
        try {
          const res = await fetch(`/api/check-username/${username}`);
          const data = await res.json();
          if (data.available) {
            statusMsg.innerText = 'Username is available!';
            statusMsg.className = 'valid';
            isUsernameAvailable = true;
            submitBtn.disabled = false;
          } else {
            statusMsg.innerText = 'Username is already taken.';
            statusMsg.className = 'invalid';
            isUsernameAvailable = false;
            submitBtn.disabled = true;
          }
        } catch (err) { console.error(err); }
      }, 500);
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!isUsernameAvailable) return;
      
      const fullName = document.getElementById('fullName').value.trim();
      const username = usernameInput.value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      submitBtn.innerText = 'Creating...'; submitBtn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, username, password })
        });
        const data = await res.json();

        if (res.ok) {
          alert('Account created successfully! Please log in.');
          window.location.href = '/login.html';
        } else {
          errorMsg.innerText = data.message || 'Registration failed';
          errorMsg.style.display = 'block';
          submitBtn.innerText = 'Sign Up'; submitBtn.disabled = false;
        }
      } catch (err) {
        errorMsg.innerText = 'Server error. Please try again.';
        errorMsg.style.display = 'block';
        submitBtn.innerText = 'Sign Up'; submitBtn.disabled = false;
      }
    });
  </script>
<script src="/theme.js"></script>
</body>
</html>
