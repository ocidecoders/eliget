<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Redirecting — Eliget</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --text-muted: #64748B; --line: #E2E8F0; --green: #10B981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; color: var(--text); opacity: 0; transition: opacity 0.3s ease; }

    .loading-container { text-align: center; display: flex; flex-direction: column; align-items: center; }
    .logo { font-family: 'Archivo', sans-serif; font-size: 2.5rem; font-weight: 900; color: var(--text); margin-bottom: 10px; letter-spacing: -1px; }
    .logo span { color: var(--green); }
    .status-text { font-size: 1rem; color: var(--text-muted); margin-bottom: 20px; font-weight: 500; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .error-box { background: var(--surface); padding: 30px; border-radius: 16px; border: 1px solid var(--line); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .error-box h2 { font-family: 'Archivo', sans-serif; color: var(--text); margin-bottom: 10px; }
    .error-box p { color: var(--text-muted); margin-bottom: 20px; }
    .btn-back { background: var(--green); color: white; text-decoration: none; padding: 10px 20px; border-radius: 999px; font-weight: 600; transition: background 0.2s; }
    .btn-back:hover { background: #059669; }
  </style>
</head>
<body>

  <div class="loading-container" id="loadingUI">
    <div class="logo">Eli<span>get</span></div>
    <div class="status-text">Finding user...</div>
    <div class="spinner"></div>
  </div>

  <div class="error-box" id="errorUI" style="display:none;">
    <h2>User Not Found</h2>
    <p>The user you are looking for doesn't exist or has deleted their account.</p>
    <a href="/home.html" class="btn-back">Back to Home</a>
  </div>

  <script src="/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { document.body.style.opacity = '1'; });

    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('username');

    if (!username) {
      showError();
    } else {
      redirectToUser(username);
    }

    async function redirectToUser(username) {
      try {
        // Search for the exact username
        const res = await fetch(`/api/search?q=${encodeURIComponent(username)}`);
        const data = await res.json();

        if (res.ok && data.users && data.users.length > 0) {
          // Find exact match (case-insensitive)
          const exactUser = data.users.find(u => u.username.toLowerCase() === username.toLowerCase());
          if (exactUser) {
            window.location.href = `/profile.html?id=${exactUser._id}`;
            return;
          }
        }

        // If no exact match found
        showError();
      } catch (err) {
        showError();
      }
    }

    function showError() {
      document.getElementById('loadingUI').style.display = 'none';
      document.getElementById('errorUI').style.display = 'block';
    }
  </script>
</body>
</html>
