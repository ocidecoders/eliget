<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">

  <!-- SEO Meta Tags -->
  <meta name="description" content="Eliget - An anti-addiction, no-algorithm, text-focused social media platform. No infinite scrolling, no short videos. Just pure connections.">
  <meta name="keywords" content="Eliget, social media, anti-addiction, no algorithm, text social media, social network, ocidecoders">
  <meta name="author" content="Ocide Coders">
  <meta property="og:title" content="Eliget - Anti-Addiction Social Media">
  <meta property="og:description" content="An anti-addiction, no-algorithm, text-focused social media platform.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eliget-social.onrender.com">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google & Bing Verification (Replace the content values after getting them from search console) -->
  <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_CODE_HERE" />
  <meta name="msvalidate.01" content="YOUR_BING_VERIFICATION_CODE_HERE" />

</head>
<body>
  <p style="text-align:center; margin-top: 50px; font-family: sans-serif;">Redirecting to profile...</p>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('username');
    if (!username) {
      window.location.href = '/home.html';
    } else {
      fetch(`/api/search?q=${encodeURIComponent(username)}`)
        .then(res => res.json())
        .then(data => {
          const exactUser = data.users.find(u => u.username.toLowerCase() === username.toLowerCase());
          if (exactUser) {
            window.location.href = `/profile.html?id=${exactUser._id}`;
          } else {
            alert(`User @${username} not found.`);
            window.location.href = '/home.html';
          }
        })
        .catch(() => window.location.href = '/home.html');
    }
  </script>
</body>
</html>
