<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings — Eliget</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">
  <style>
    :root { --bg: #F3F4F6; --surface: #FFFFFF; --text: #111827; --text-muted: #6B7280; --line: #E5E7EB; --green: #10B981; --green-light: #ecfdf5; --danger: #EF4444; --danger-light: #FEF2F2; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 40px; color: var(--text); }
    
    .top-nav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line); padding: 15px 20px; display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; padding: 5px; border-radius: 50%; transition: background 0.2s; }
    .back-btn:hover { background: var(--bg); }
    .back-btn svg { width: 24px; height: 24px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo { font-family: 'Archivo', sans-serif; font-size: 1.3rem; font-weight: 900; color: var(--text); }
    .logo span { color: var(--green); }

    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    
    .settings-card { background: var(--surface); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 20px; border: 1px solid var(--line); }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 15px; }
    .card-header svg { width: 20px; height: 20px; stroke: var(--green); fill: none; stroke-width: 2; }
    .card-title { font-family: 'Archivo', sans-serif; font-size: 1.1rem; font-weight: 600; color: var(--text); }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
    .input-wrapper { position: relative; }
    .input-wrapper svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: #9CA3AF; fill: none; stroke-width: 2; }
    .input-wrapper input { width: 100%; padding: 14px 14px 14px 42px; border: 1px solid var(--line); border-radius: 12px; background: #F9FAFB; font-family: inherit; font-size: 0.95rem; color: var(--text); outline: none; transition: all 0.2s; }
    .input-wrapper input:focus { border-color: var(--green); background: var(--surface); box-shadow: 0 0 0 3px var(--green-light); }
    .input-wrapper input:disabled { background: var(--bg); color: var(--text-muted); cursor: not-allowed; }

    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
    .badge-option { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; transition: all 0.2s; }
    .badge-option:hover { border-color: #D1D5DB; }
    .badge-option svg { width: 24px; height: 24px; stroke: var(--text-muted); fill: none; stroke-width: 2; transition: all 0.2s; }
    .badge-option span { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .badge-option.active { border-color: var(--green); background: var(--green-light); box-shadow: inset 0 0 0 1px var(--green); }
    .badge-option.active svg { stroke: var(--green); }
    .badge-option.active span { color: var(--green); }

    .btn-save { width: 100%; background: var(--green); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
    .btn-save:hover { opacity: 0.9; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

    .action-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .action-row:last-child { border-bottom: none; padding-bottom: 0; }
    .action-info h4 { font-size: 0.95rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .action-info p { font-size: 0.8rem; color: var(--text-muted); }
    
    .btn-action { padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
    .btn-action.danger { background: var(--danger-light); color: var(--danger); border-color: #FCA5A5; }
    .btn-action.danger:hover { background: #FEE2E2; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: white; padding: 12px 24px; border-radius: 999px; font-size: 0.9rem; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.2); opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 3000; display: flex; align-items: center; gap: 8px; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast svg { width: 18px; height: 18px; stroke: var(--green); fill: none; stroke-width: 3; }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.location.href='/dashboard.html'">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="logo">Set<span>tings</span></div>
  </div>

  <div class="container">
    <div class="settings-card">
      <div class="card-header">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <h2 class="card-title">Profile Information</h2>
      </div>
      
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-wrapper">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input type="text" id="fullNameInput" placeholder="Enter your full name">
        </div>
      </div>

      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="text" id="usernameInput" disabled>
        </div>
      </div>

      <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; margin-top: 30px;">Select Profession Badge</label>
      <div class="badge-grid" id="badgeGrid">
        <div class="badge-option" data-badge="Singer">
          <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          <span>Singer</span>
        </div>
        <div class="badge-option" data-badge="Freelancer">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
          <span>Freelancer</span>
        </div>
        <div class="badge-option" data-badge="Business">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          <span>Business</span>
        </div>
        <div class="badge-option" data-badge="Writer">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
          <span>Writer</span>
        </div>
        <div class="badge-option" data-badge="General">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>General</span>
        </div>
      </div>

      <button class="btn-save" id="saveBtn">Save Changes</button>
    </div>

    <div class="settings-card">
      <div class="card-header">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <h2 class="card-title">Security</h2>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrapper">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" placeholder="Enter new password" disabled>
        </div>
      </div>
      <button class="btn-save" style="background: var(--text-muted);" onclick="alert('Password change will be available in the next update.')">Update Password</button>
    </div>

    <div class="settings-card">
      <div class="card-header">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <h2 class="card-title">Account Actions</h2>
      </div>
      
      <div class="action-row">
        <div class="action-info">
          <h4>Log Out</h4>
          <p>Safely log out from this device.</p>
        </div>
        <button class="btn-action danger" id="logoutBtn">Log Out</button>
      </div>

      <div class="action-row">
        <div class="action-info">
          <h4>Delete Account</h4>
          <p>Permanently delete your profile.</p>
        </div>
        <button class="btn-action danger" onclick="alert('Account deletion is currently disabled for safety.')">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span id="toastMsg">Changes saved!</span>
  </div>

  <script>
    let user = null;
    let selectedBadge = 'General';

    async function initAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error();
        const data = await res.json();
        user = data.user;
        localStorage.setItem('eliget_user', JSON.stringify(user));
        
        selectedBadge = user.badge || 'General';
        document.getElementById('fullNameInput').value = user.fullName;
        document.getElementById('usernameInput').value = '@' + user.username;
        highlightBadge();
      } catch (err) {
        localStorage.removeItem('eliget_user');
        window.location.href = '/login.html';
      }
    }

    function highlightBadge() {
      document.querySelectorAll('.badge-option').forEach(opt => {
        if (opt.dataset.badge === selectedBadge) opt.classList.add('active');
        else opt.classList.remove('active');
      });
    }

    document.querySelectorAll('.badge-option').forEach(opt => {
      opt.addEventListener('click', () => { selectedBadge = opt.dataset.badge; highlightBadge(); });
    });

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const newName = document.getElementById('fullNameInput').value.trim();
      const btn = document.getElementById('saveBtn');
      if (!newName) return alert('Full name cannot be empty!');
      btn.innerText = 'Saving...'; btn.disabled = true;
      try {
        const res = await fetch(`/api/user/update-profile/${user.id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fullName: newName, badge: selectedBadge }) });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('eliget_user', JSON.stringify(data.user));
          showToast('Profile updated successfully!');
        } else { alert(data.message || 'Failed to update profile.'); }
      } catch (err) { alert('Server error.'); }
      btn.innerText = 'Save Changes'; btn.disabled = false;
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST' });
        localStorage.removeItem('eliget_user');
        window.location.href = '/login.html';
      } catch (err) { alert('Error logging out'); }
    });

    initAuth();
  </script>
</body>
</html>
