<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings — Eliget</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg: #F3F4F6; --surface: #FFFFFF; --text: #111827; --text-muted: #6B7280; --line: #E5E7EB; --green: #10B981; --red: #EF4444; }
    [data-theme="dark"] { --bg: #111827; --surface: #1F2937; --text: #F9FAFB; --text-muted: #9CA3AF; --line: #374151; }
    [data-theme="dark"] body { background-color: var(--bg); color: var(--text); }
    [data-theme="dark"] .top-nav, [data-theme="dark"] .settings-card, [data-theme="dark"] .modal-box { background-color: var(--surface); border-color: var(--line); }
    [data-theme="dark"] input { background-color: var(--bg); color: var(--text); border-color: var(--line); }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 70px; opacity: 0; transition: opacity 0.3s ease-in-out; }

    .top-nav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 15px; }
    .back-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; padding: 5px; border-radius: 50%; }
    .back-btn svg { width: 24px; height: 24px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo { font-family: 'Archivo', sans-serif; font-size: 1.3rem; font-weight: 900; color: var(--text); }
    .logo span { color: var(--green); }

    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    
    .settings-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .settings-card h3 { font-family: 'Archivo', sans-serif; font-size: 1.2rem; margin-bottom: 15px; color: var(--text); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    
    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .setting-item:last-child { border-bottom: none; }
    .setting-item span { font-weight: 500; color: var(--text); font-size: 0.95rem; }
    .setting-item svg { width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; }

    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-primary { background: var(--green); color: white; }
    .btn-primary:hover { background: #059669; }
    
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 15px; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; font-size: 1rem; outline: none; background: var(--bg); color: var(--text); }
    .form-group input:focus { border-color: var(--green); background: var(--surface); }
    
    .toast-notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--text); color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.2); opacity: 0; transition: all 0.3s; z-index: 3000; }
    .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* App Download Banner */
    .app-download-banner { background: linear-gradient(135deg, #10B981, #059669); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; color: white; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .app-download-banner svg { width: 40px; height: 40px; fill: white; flex-shrink: 0; }
    .app-info h4 { font-family: 'Archivo', sans-serif; font-size: 1.1rem; margin-bottom: 4px; }
    .app-info p { font-size: 0.8rem; opacity: 0.9; margin-bottom: 10px; }
    .btn-download-app { background: white; color: var(--green); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>

  <div class="top-nav">
    <button class="back-btn" onclick="window.location.href='/dashboard.html'">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="logo">Set<span>tings</span></div>
  </div>

  <div class="container">
    
    <!-- App Download Banner (Optional if APK exists) -->
    <div class="app-download-banner">
      <svg viewBox="0 0 24 24"><path d="M17.5 14.33c-.02-2.02 1.62-2.98 1.68-3.03-1.08-1.58-2.78-1.8-3.29-1.82-1.37-.14-2.68.81-3.38.81-.72 0-1.81-.79-2.98-.76-1.48.02-2.85.86-3.61 2.18-1.54 2.67-.39 6.64 1.11 8.81.73 1.06 1.61 2.25 2.76 2.21 1.13-.04 1.55-.73 2.92-.73s1.73.73 2.91.71c1.18-.02 1.94-1.07 2.67-2.14.84-1.22 1.19-2.4 1.21-2.46-.03-.01-2.35-.9-2.37-3.57zM15.34 5.69c.61-.74 1.01-1.76.9-2.79-.86.03-1.91.57-2.53 1.3-.56.65-1.05 1.71-.91 2.71.96.07 1.93-.49 2.54-1.22z"/></svg>
      <div class="app-info">
        <h4>Eliget for Android</h4>
        <p>Install the official app for a better experience.</p>
        <a href="/download/eliget.apk" class="btn-download-app" download>Download APK</a>
      </div>
    </div>

    <div class="settings-card">
      <h3>Profile Information</h3>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Your Name">
      </div>
      <div class="form-group">
        <label>Bio (Max 100 chars)</label>
        <input type="text" id="bio" placeholder="Tell us about yourself" maxlength="100">
      </div>
      <div class="form-group">
        <label>Website Title</label>
        <input type="text" id="webTitle" placeholder="My Portfolio">
      </div>
      <div class="form-group">
        <label>Website URL</label>
        <input type="url" id="webUrl" placeholder="https://example.com">
      </div>
      <button class="btn btn-primary" onclick="updateProfile()">Save Profile</button>
    </div>

    <div class="settings-card">
      <h3>Change Password</h3>
      <div class="form-group">
        <label>Old Password</label>
        <input type="password" id="oldPass" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPass" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
    </div>

    <div class="settings-card">
      <h3>Account & Security</h3>
      <div class="setting-item" onclick="toggleDarkMode()">
        <span>Dark Mode</span>
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </div>
      <div class="setting-item" onclick="deleteAccount()">
        <span style="color: var(--red);">Delete Account Permanently</span>
        <svg viewBox="0 0 24 24" style="stroke: var(--red);"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </div>
    </div>
  </div>

  <div class="toast-notification" id="toast">Saved successfully!</div>

  <script src="/theme.js"></script>
  <script>
    let user = null;
    
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function initAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error();
        const data = await res.json();
        user = data.user;
        
        document.getElementById('fullName').value = user.fullName || '';
        document.getElementById('bio').value = user.bio || '';
        if (user.website) {
          document.getElementById('webTitle').value = user.website.title || '';
          document.getElementById('webUrl').value = user.website.url || '';
        }
      } catch (err) {
        window.location.href = '/login.html';
      }
    }

    async function updateProfile() {
      const fullName = document.getElementById('fullName').value.trim();
      const bio = document.getElementById('bio').value.trim();
      const webTitle = document.getElementById('webTitle').value.trim();
      const webUrl = document.getElementById('webUrl').value.trim();
      
      try {
        const res = await fetch('/api/user/update-profile/' + user.id, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, bio, websiteTitle: webTitle, websiteUrl: webUrl })
        });
        if (res.ok) showToast('Profile updated successfully!');
        else showToast('Failed to update profile.');
      } catch (err) { showToast('Server error.'); }
    }

    async function changePassword() {
      const oldPassword = document.getElementById('oldPass').value;
      const newPassword = document.getElementById('newPass').value;
      
      if (!oldPassword || !newPassword) return showToast('Please fill both password fields.');
      
      try {
        const res = await fetch('/api/user/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oldPassword, newPassword })
        });
        const data = await res.json();
        if (res.ok) {
          showToast('Password updated successfully!');
          document.getElementById('oldPass').value = '';
          document.getElementById('newPass').value = '';
        } else {
          showToast(data.message || 'Failed to update password.');
        }
      } catch (err) { showToast('Server error.'); }
    }

    async function deleteAccount() {
      if (!confirm('Are you absolutely sure you want to delete your account? This action cannot be undone.')) return;
      
      try {
        const res = await fetch('/api/user/delete-account', { method: 'DELETE' });
        if (res.ok) {
          localStorage.removeItem('eliget_user');
          window.location.href = '/register.html';
        } else {
          showToast('Failed to delete account.');
        }
      } catch (err) { showToast('Server error.'); }
    }

    initUser();
  </script>
</body>
</html>
